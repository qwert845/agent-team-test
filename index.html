<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>과녁 맞히기</title>
  <style>
    body { margin: 0; background: #1c1c1f; color: #e8e8ea; font: 16px system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
    #field { position: relative; width: 640px; height: 360px; max-width: 100vw; background: #2a2a2e; overflow: hidden; }
    #target { position: absolute; width: 64px; height: 64px; border: 0; padding: 0; border-radius: 50%; background: #8a8a90; cursor: pointer; }
    #hud { margin-top: 8px; }
    #combo { margin-top: 4px; }
  </style>
</head>
<body>
  <div>
    <div id="field"><button id="target" aria-label="과녁"></button></div>
    <div id="hud"></div>
    <div id="combo"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
